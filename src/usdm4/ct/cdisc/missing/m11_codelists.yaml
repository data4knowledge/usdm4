  - conceptId: C218498
    preferredTerm: New Data Available (Other Than Safety Data)
    definition: Previously unavailable data (other than safety data) becomes available,
      which necessitates a change(s) to, or formal clarification of, the protocol.
    submissionValue: ''
    synonyms: []
  - conceptId: C218491
    preferredTerm: New Regulatory Guidance
    definition: A regulatory agency has published a guidance document that necessitates
      a change(s) to, or formal clarification of, the protocol.
    submissionValue: ''
    synonyms: []
  - conceptId: C218493
    preferredTerm: New Safety Information Available
    definition: Previously unavailable safety data becomes available, which necessitates
      a change(s) to, or formal clarification of, the protocol.
    submissionValue: ''
    synonyms: []
  - conceptId: C48660
    preferredTerm: Not Applicable
    definition: Determination of a value is not relevant in the current context.
    submissionValue: ''
    synonyms: []
  - conceptId: C17649
    preferredTerm: Other
    definition: Different than the one(s) previously specified or mentioned.
    submissionValue: ''
    synonyms: []
  - conceptId: C218502
    preferredTerm: Protocol Design Error
    definition: A protocol design error necessitates a change(s) to, or formal clarification
      of, a document.
    submissionValue: ''
    synonyms: []
  - conceptId: C218500
    preferredTerm: Recruitment Difficulty
    definition: Challenges with participant recruitment necessitates a change(s) to,
      or formal clarification of, the protocol.
    submissionValue: ''
    synonyms: []
  - conceptId: C218490
    preferredTerm: Regulatory Agency Request To Amend
    definition: A regulatory agency has expressed a need for a change(s) to, or formal
      clarification of, the protocol.
    submissionValue: ''
    synonyms: []
- codelist: C217277
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Intervention Model Response Terminology
  definition: A valid value set relevant to the intervention model responses within
    the ICH M11 protocol template.
  extensible: false
  synonyms:
  - Intervention Model Response Terminology
  terms:
  - conceptId: C82637
    preferredTerm: Cross-over
    definition: Participants receive one of two or more alternative intervention(s)
      during the initial epoch of the study and receive other intervention(s) during
      the subsequent epoch(s) of the trial.
    submissionValue: ''
    synonyms: []
  - conceptId: C82638
    preferredTerm: Factorial
    definition: Two or more interventions, each alone or in combination, are evaluated
      in parallel against a control group. This study design allows for the comparison
      of active drug to placebo, presence of drug-drug interactions, and comparison
      of active drugs against each other.
    submissionValue: ''
    synonyms: []
  - conceptId: C17649
    preferredTerm: Other
    definition: Different than the one(s) previously specified or mentioned.
    submissionValue: ''
    synonyms: []
  - conceptId: C82639
    preferredTerm: Parallel Group
    definition: Participants are assigned to one of two or more treatment groups in
      parallel for the duration of the study.
    submissionValue: ''
    synonyms: []
  - conceptId: C142568
    preferredTerm: Sequential
    definition: Groups of participants are assigned to receive interventions based
      on prior milestones being reached in the study.
    submissionValue: ''
    synonyms: []
  - conceptId: C82640
    preferredTerm: Single Group
    definition: All trial participants are assigned to a single treatment group for
      the duration of the study.
    submissionValue: ''
    synonyms: []
- codelist: C217278
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Population Type Response Terminology
  definition: A valid value set relevant to the population type responses within the
    ICH M11 protocol template.
  extensible: false
  synonyms:
  - Population Type Response Terminology
  terms:
  - conceptId: C218503
    preferredTerm: With Disease
    definition: An indication that the individual or group of individuals has been
      diagnosed with the disease of interest or under study.
    submissionValue: ''
    synonyms: []
  - conceptId: C218504
    preferredTerm: Without Disease
    definition: An indication that the individual or group of individuals has not
      been diagnosed with the disease of interest or under study.
    submissionValue: ''
    synonyms: []
- codelist: C217279
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Control Type Response Terminology
  definition: A valid value set relevant to the control type responses within the
    ICH M11 protocol template.
  extensible: false
  synonyms:
  - Control Type Response Terminology
  terms:
  - conceptId: C49649
    preferredTerm: Active Comparator
    definition: A type of control, which has a demonstrated effect, administered as
      a comparator to participants in a clinical trial.
    submissionValue: ''
    synonyms: []
  - conceptId: C218505
    preferredTerm: Different Dose or Regimen
    definition: A type of control that comprises a different dose or dosage regimen
      in comparison to the investigational intervention dose or dosage regimen.
    submissionValue: ''
    synonyms: []
  - conceptId: C120841
    preferredTerm: Dose Response
    definition: A type of control using different doses or regimens of the same treatment
      across the treatment arms.
    submissionValue: ''
    synonyms: []
  - conceptId: C218506
    preferredTerm: External
    definition: The use of external control data as a control arm for those studies
      where ethical concerns and/or underserved disease indications may make it difficult
      to enroll participants.
    submissionValue: ''
    synonyms: []
  - conceptId: C28280
    preferredTerm: No Control
    definition: A clinical study that lacks a comparison (i.e., a control) group.
    submissionValue: ''
    synonyms: []
  - conceptId: C49648
    preferredTerm: Placebo
    definition: An inactive, identical-appearing drug or treatment that does not contain
      the test product.
    submissionValue: ''
    synonyms: []
  - conceptId: C184727
    preferredTerm: Sham Procedure
    definition: A type of negative control in which a procedure is performed that
      mimics the procedure under study but does not include investigational processes
      or components.
    submissionValue: ''
    synonyms: []
- codelist: C217280
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Trial Intervention Assignment Method Response Terminology
  definition: A valid value set relevant to the trial intervention assignment method
    responses within the ICH M11 protocol template.
  extensible: false
  synonyms:
  - Trial Intervention Assignment Method Response Terminology
  terms:
  - conceptId: C222801
    preferredTerm: No Intervention Assignment Method
    definition: No specific methodology is used to assign trial participants to treatment
      or control groups.
    submissionValue: ''
    synonyms: []
  - conceptId: C17649
    preferredTerm: Other
    definition: Different than the one(s) previously specified or mentioned.
    submissionValue: ''
    synonyms: []
  - conceptId: C25196
    preferredTerm: Randomisation
    definition: The process of assigning trial participants to treatment or control
      groups using an element of chance to determine the assignments in order to reduce
      bias. (CDISC Glossary)
    submissionValue: ''
    synonyms: []
- codelist: C217281
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Trial Blinding Role Response Terminology
  definition: A valid value set relevant to the trial blinding role responses within
    the ICH M11 protocol template.
  extensible: false
  synonyms:
  - Trial Blinding Role Response Terminology
  terms:
  - conceptId: C17445
    preferredTerm: Care Provider
    definition: The primary person in charge of the care of a patient, usually a family
      member or a designated health care professional.
    submissionValue: ''
    synonyms: []
  - conceptId: C25936
    preferredTerm: Investigator
    definition: A person responsible for the conduct of the clinical trial at a trial
      site. If a trial is conducted by a team of individuals at the trial site, the
      investigator is the responsible leader of the team and may be called the principal
      investigator.
    submissionValue: ''
    synonyms: []
  - conceptId: C48660
    preferredTerm: Not Applicable
    definition: Determination of a value is not relevant in the current context.
    submissionValue: ''
    synonyms: []
  - conceptId: C207599
    preferredTerm: Outcomes Assessor
    definition: The individual who evaluates the outcome(s) of interest.
    submissionValue: ''
    synonyms: []
  - conceptId: C142710
    preferredTerm: Participant
    definition: A member of the clinical study population from whom data are being
      collected. (CDISC Glossary)
    submissionValue: ''
    synonyms: []
  - conceptId: C70793
    preferredTerm: Sponsor
    definition: An individual, company, institution, or organization that takes responsibility
      for the initiation, management, and/or financing of a clinical study. (CDISC
      Glossary)
    submissionValue: ''
    synonyms: []
- codelist: C217282
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Independent Committee Name Response Terminology
  definition: A valid value set relevant to the independent committee name responses
    within the ICH M11 protocol template.
  extensible: false
  synonyms:
  - Independent Committee Name Response Terminology
  terms:
  - conceptId: C215671
    preferredTerm: Dose Escalation Committee
    definition: A type of safety monitoring committee that monitors dose escalation
      activities in first-in-human trials.
    submissionValue: ''
    synonyms: []
  - conceptId: C78726
    preferredTerm: Endpoint Adjudication Committee
    definition: An external committee whose purpose is to evaluate study data and
      decide whether a study endpoint or other criterion has been met.
    submissionValue: ''
    synonyms: []
  - conceptId: C142578
    preferredTerm: Independent Data Monitoring Committee
    definition: A committee established by the sponsor to assess at intervals the
      progress of a clinical trial, safety data, and critical efficacy variables and
      recommend to the sponsor whether to continue, modify, or terminate the trial.
    submissionValue: ''
    synonyms: []
  - conceptId: C41132
    preferredTerm: None
    definition: No person or thing, nobody, not any.
    submissionValue: ''
    synonyms: []
  - conceptId: C17649
    preferredTerm: Other
    definition: Different than the one(s) previously specified or mentioned.
    submissionValue: ''
    synonyms: []
- codelist: C217283
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Trial Arm Type Response Terminology
  definition: A valid value set relevant to the trial arm type responses within the
    ICH M11 protocol template.
  extensible: false
  synonyms:
  - Trial Arm Type Response Terminology
  terms:
  - conceptId: C174267
    preferredTerm: Active Comparator Arm
    definition: An arm describing the active comparator.
    submissionValue: ''
    synonyms: []
  - conceptId: C174226
    preferredTerm: Control Arm
    definition: An arm describing the intervention or treatment plan for a group of
      participants in the study receiving a control. The control may comprise a non-investigational
      product (active control) or regimen, placebo, or no treatment.
    submissionValue: ''
    synonyms: []
  - conceptId: C174266
    preferredTerm: Experimental Arm
    definition: An arm describing the intervention or treatment plan for a group of
      participants in the study receiving test product(s).
    submissionValue: ''
    synonyms: []
  - conceptId: C174270
    preferredTerm: No Intervention Arm
    definition: A study arm without an intervention or treatment.
    submissionValue: ''
    synonyms: []
  - conceptId: C174268
    preferredTerm: Placebo Comparator Arm
    definition: An arm describing the placebo comparator.
    submissionValue: ''
    synonyms: []
  - conceptId: C174269
    preferredTerm: Sham Comparator Arm
    definition: An arm describing the sham comparator.
    submissionValue: ''
    synonyms: []
- codelist: C217284
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Intervention Type Response Terminology
  definition: A valid value set relevant to the intervention type responses within
    the ICH M11 protocol template.
  extensible: false
  synonyms:
  - Intervention Type Response Terminology
  terms:
  - conceptId: C15184
    preferredTerm: Behavioural
    definition: A technique used to change the behavior of a participant (e.g., psychotherapy,
      lifestyle counseling, or hypnosis).
    submissionValue: ''
    synonyms: []
  - conceptId: C307
    preferredTerm: Biologic
    definition: 'A product of biological origin applicable to the prevention, treatment,
      or cure of a disease or condition, for example: virus, therapeutic serum, toxin,
      antitoxin, vaccine, blood, blood component or derivative, allergenic product,
      or analogous product.'
    submissionValue: ''
    synonyms: []
  - conceptId: C54696
    preferredTerm: Combination Product
    definition: A product composed of two or more different types of medical products
      (i.e., a combination of a drug, device, and/or biological product with one another
      and are referred to as "constituent parts" of the combination product). (CDISC
      Glossary)
    submissionValue: ''
    synonyms: []
  - conceptId: C18020
    preferredTerm: Diagnostic
    definition: Any procedure or test to diagnose a disease or disorder.
    submissionValue: ''
    synonyms: []
  - conceptId: C1505
    preferredTerm: Dietary Supplement
    definition: Preparations containing ingredient(s) intended to supplement the diet.
    submissionValue: ''
    synonyms: []
  - conceptId: C1909
    preferredTerm: Drug
    definition: An active natural, synthetic or semi-synthetic ingredient including
      endogenous body substance that is intended to furnish pharmacological activity
      or other direct effect in the diagnosis, cure, mitigation, treatment, or prevention
      of disease or to affect the structure or any function of the human body, but
      does not include intermediates used in the synthesis of such ingredient.
    submissionValue: ''
    synonyms: []
  - conceptId: C15238
    preferredTerm: Genetic
    definition: Introduction of genetic material into cells in order to correct or
      treat an inherited or acquired disease.
    submissionValue: ''
    synonyms: []
  - conceptId: C16830
    preferredTerm: Medical Device
    definition: Any instrument, apparatus, implement, machine, appliance, implant,
      reagent for in vitro use, software, material or other similar or related article,
      intended by the manufacturer to be used, alone or in combination for, one or
      more specific medical purpose(s). (CDISC Glossary)
    submissionValue: ''
    synonyms: []
  - conceptId: C218507
    preferredTerm: Non-Surgical Procedure
    definition: A medical procedure that produces an effect, or that is intended to
      alter the course of a disease in a patient or population, which is not considered
      a surgical procedure.
    submissionValue: ''
    synonyms: []
  - conceptId: C15313
    preferredTerm: Radiation
    definition: Use of targeted or whole body radiation to treat a disease.
    submissionValue: ''
    synonyms: []
  - conceptId: C15329
    preferredTerm: Surgery
    definition: A diagnostic or treatment procedure performed by manual and/or instrumental
      means, often involving an incision and the removal or replacement of a diseased
      organ or tissue; of or relating to or involving or used in surgery or requiring
      or amenable to treatment by surgery.
    submissionValue: ''
    synonyms: []
  - conceptId: C923
    preferredTerm: Vaccine
    definition: A medicinal product inducing immunity against disease, most often
      to prevent occurrence of a disease, (e.g., a preventative vaccine against infectious
      disease), but also to treat a disease, (e.g., a therapeutic vaccine against
      cancer). (CDISC Glossary)
    submissionValue: ''
    synonyms: []
- codelist: C217285
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Intervention Use Response Terminology
  definition: A valid value set relevant to the intervention use responses within
    the ICH M11 protocol template.
  extensible: false
  synonyms:
  - Intervention Use Response Terminology
  terms:
  - conceptId: C207614
    preferredTerm: Additional Required Treatment
    definition: A medicinal product that must be administered along with the experimental
      treatment (e.g., drug studies wherein opioid blockers are administered to prevent
      overdose).
    submissionValue: ''
    synonyms: []
  - conceptId: C165822
    preferredTerm: Background Treatment
    definition: Medicinal products that are administered to each clinical trial participant,
      regardless of randomisation group, a) to treat the indication which is the object
      of the study, or b) required in the protocol as part of standard care for a
      condition that is not the indication under investigation, and is relevant for
      the clinical trial design. (CDISC Glossary)
    submissionValue: ''
    synonyms: []
  - conceptId: C158128
    preferredTerm: Challenge Agent
    definition: A non-investigational medicinal product (NIMP) given to trial participants
      to produce a physiological response that is necessary before the pharmacological
      action of the investigational medicinal product can be assessed. (CDISC Glossary)
    submissionValue: ''
    synonyms: []
  - conceptId: C18020
    preferredTerm: Diagnostic
    definition: Any procedure or test to diagnose a disease or disorder.
    submissionValue: ''
    synonyms: []
  - conceptId: C41161
    preferredTerm: Experimental Intervention
    definition: The drug, device, therapy, procedure, or process under investigation
      in a clinical study that is believed to have an effect on outcomes of interest
      in a study (e.g., health-related quality of life, efficacy, safety, pharmacoeconomics).
      (CDISC Glossary)
    submissionValue: ''
    synonyms: []
  - conceptId: C753
    preferredTerm: Placebo
    definition: A pharmaceutical preparation that does not contain the investigational
      agent and is generally prepared to be physically indistinguishable from the
      preparation containing the investigational product.
    submissionValue: ''
    synonyms: []
  - conceptId: C165835
    preferredTerm: Rescue Medicine
    definition: Medicinal products identified in the protocol as those that may be
      administered to participants when the efficacy of the investigational medicinal
      product (IMP) is not satisfactory, the effect of the IMP is too great and is
      likely to cause a hazard to the patient, or to manage an emergency situation.
      (CDISC Glossary)
    submissionValue: ''
    synonyms: []
- codelist: C217286
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Investigational Medicinal Product Indicator Response Terminology
  definition: A valid value set relevant to the investigational medicinal product
    indicator responses within the ICH M11 protocol template.
  extensible: false
  synonyms:
  - Investigational Medicinal Product Indicator Response Terminology
  terms:
  - conceptId: C202579
    preferredTerm: IMP
    definition: A medicinal product which is being tested or used as a reference,
      including as a placebo, in a clinical trial.
    submissionValue: ''
    synonyms: []
  - conceptId: C156473
    preferredTerm: NIMP
    definition: A medicinal product that is related to the specific needs of the clinical
      trial as described in the protocol, but not as an investigational medicinal
      product. (CDISC Glossary)
    submissionValue: ''
    synonyms: []
- codelist: C217287
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Trial-Related Safety Event Type Response Terminology
  definition: A valid value set relevant to the trial-related safety event type responses
    within the ICH M11 protocol template.
  extensible: false
  synonyms:
  - Trial-Related Safety Event Type Response Terminology
  terms:
  - conceptId: C41331
    preferredTerm: Adverse Event
    definition: Any untoward medical occurrence in a patient or clinical investigation
      participant administered a pharmaceutical product and which does not necessarily
      have to have a causal relationship with this treatment.
    submissionValue: ''
    synonyms: []
  - conceptId: C222331
    preferredTerm: Drug/Device Combination Product Complaint
    definition: Any concern about the safety, quality, and/or performance of a trial-related
      drug-device combination.
    submissionValue: ''
    synonyms: []
  - conceptId: C218510
    preferredTerm: Lactation Event
    definition: Any event that occurs when the participant is lactating.
    submissionValue: ''
    synonyms: []
  - conceptId: C218513
    preferredTerm: Not Reportable Adverse Event of Special Interest
    definition: An adverse event of special interest (serious or non-serious) is one
      of scientific and medical concern specific to the sponsor's product or program,
      for which ongoing monitoring and rapid communication by the investigator to
      the sponsor could be appropriate, and which is deemed to be not reportable to
      the appropriate regulatory authority.
    submissionValue: ''
    synonyms: []
  - conceptId: C17649
    preferredTerm: Other
    definition: Different than the one(s) previously specified or mentioned.
    submissionValue: ''
    synonyms: []
  - conceptId: C218511
    preferredTerm: Post-Partum Event
    definition: Any event that occurs when the participant is in the stages of recovery
      post pregnancy and birth event.
    submissionValue: ''
    synonyms: []
  - conceptId: C218509
    preferredTerm: Pregnancy Event
    definition: Any event that occurs when the participant or participant's partner
      becomes pregnant or is pregnant.
    submissionValue: ''
    synonyms: []
  - conceptId: C218512
    preferredTerm: Reportable Adverse Event of Special Interest
    definition: An adverse event of special interest (serious or non-serious) is one
      of scientific and medical concern specific to the sponsor's product or program,
      for which ongoing monitoring and rapid communication by the investigator to
      the sponsor could be appropriate, and which is deemed to be reportable to the
      appropriate regulatory authority.
    submissionValue: ''
    synonyms: []
  - conceptId: C41335
    preferredTerm: Serious Adverse Event
    definition: 'Any untoward medical occurrence that at any dose: results in death,
      is life-threatening, requires inpatient hospitalisation or prolongation of existing
      hospitalisation, results in persistent or significant disability/incapacity,
      is a congenital anomaly/birth defect, or any other medically significant event
      that may not be immediately life-threatening or result in death or hospitalisation
      but may jeopardise the patient or may require intervention to prevent one of
      the other outcomes listed in the definition.'
    submissionValue: ''
    synonyms: []
  - conceptId: C218508
    preferredTerm: Trial Intervention Complaint
    definition: Any concern about the safety and/or quality of any trial-related interventions.
    submissionValue: ''
    synonyms: []
