- codelist: C217045
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Trial Phase Response Terminology
  definition: Terminology associated with the trial phase value set codelist of the
    ICH M11 protocol template.
  extensible: false
  synonyms:
  - Trial Phase Response Terminology
  terms:
  - conceptId: C54721
    preferredTerm: Early Phase 1
    definition: Exploratory clinical trials, in a small number of participants, that
      are conducted early in Phase 1. The investigational trial intervention is administered
      at a low dose for a limited time. Early Phase 1 trials provide insights into
      a variety of parameters such as pharmacokinetic, pharmacodynamic, and other
      biomarkers. They involve limited human exposure, have no therapeutic or diagnostic
      intent, and are not intended to assess clinical tolerability.
    submissionValue: ''
    synonyms: []
  - conceptId: C15600
    preferredTerm: Phase 1
    definition: Exploratory clinical trials that may be first-in-human, conducted
      in a small number of patients or healthy volunteers to evaluate clinical safety,
      tolerability, or therapeutic intent (pharmacokinetics and pharmacodynamics)
      of an investigational trial intervention.
    submissionValue: ''
    synonyms: []
  - conceptId: C15693
    preferredTerm: Phase 1/Phase 2
    definition: A single clinical trial that combines elements of Phase 1 and Phase
      2 trials, which may begin as a Phase 1 trial and transition into Phase 2 based
      upon predetermined criteria.
    submissionValue: ''
    synonyms: []
  - conceptId: C198366
    preferredTerm: Phase 1/Phase 2/Phase 3
    definition: A single clinical trial that combines elements of Phase 1, Phase 2,
      and Phase 3 trials, which may begin as a Phase 1 trial and transitions through
      Phase 2 and Phase 3 based upon predetermined criteria.
    submissionValue: ''
    synonyms: []
  - conceptId: C198367
    preferredTerm: Phase 1/Phase 3
    definition: A single clinical trial that combines elements of Phase 1 and Phase
      3 trials, which may begin as a Phase 1 trial and transition into Phase 3 based
      upon predetermined criteria.
    submissionValue: ''
    synonyms: []
  - conceptId: C15601
    preferredTerm: Phase 2
    definition: Exploratory trials conducted to evaluate the safety and efficacy of
      the investigational trial intervention in patients with the disease or condition.
      Objectives may include, but are not limited to, clinical pharmacology, dose-ranging
      (dose-response, frequency of dosing), type of patients, or other characteristics
      of safety and efficacy.
    submissionValue: ''
    synonyms: []
  - conceptId: C15694
    preferredTerm: Phase 2/Phase 3
    definition: A single clinical trial that combines elements of Phase 2 and Phase
      3 trials, which may begin as a Phase 2 trial and transition into Phase 3 based
      upon predetermined criteria.
    submissionValue: ''
    synonyms: []
  - conceptId: C217024
    preferredTerm: Phase 2/Phase 3/Phase 4
    definition: A single clinical trial that combines elements of Phase 2, Phase 3,
      and Phase 4 trials, which may begin as a Phase 2 trial and transitions through
      Phase 3 and Phase 4 based upon predetermined criteria.
    submissionValue: ''
    synonyms: []
  - conceptId: C15602
    preferredTerm: Phase 3
    definition: Confirmatory trials conducted to demonstrate safety, efficacy and
      tolerability of the investigational trial intervention in patients with the
      disease or condition. Their objectives are to evaluate the overall benefit-risk
      relationship and may provide substantial evidence for regulatory approval and
      product information.
    submissionValue: ''
    synonyms: []
  - conceptId: C217025
    preferredTerm: Phase 3/Phase 4
    definition: A single clinical trial that combines elements of Phase 3 and Phase
      4 trials, which may begin as a Phase 3 trial and transition into Phase 4 based
      upon predetermined criteria.
    submissionValue: ''
    synonyms: []
  - conceptId: C15603
    preferredTerm: Phase 4
    definition: Post-approval (or post-marketing) trials conducted to further evaluate
      the safety and efficacy of an investigational trial intervention in its approved
      indication and may be conducted to address a regulatory requirement. These studies
      may explore use of the investigational trial intervention in the real-world
      setting of clinical practice and may also inform health economics and health
      technology assessments.
    submissionValue: ''
    synonyms: []
