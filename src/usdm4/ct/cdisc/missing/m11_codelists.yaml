- codelist: C217051
  source: NCIt-M11
  effective_date: '2025-12-19'
  preferredTerm: Trial Blinding Schema Response Terminology
  definition: Terminology associated with the trial blind schema value set codelist
    of the ICH M11 protocol template.
  extensible: false
  synonyms:
  - Trial Blinding Schema Response Terminology
  terms:
  - conceptId: C15228
    preferredTerm: Double Blind
    definition: A study in which neither the participant nor the study personnel interacting
      with the participant or data during the study knows what intervention a participant
      is receiving.
    submissionValue: ''
    synonyms: []
  - conceptId: C187674
    preferredTerm: Observer Blind
    definition: A study in which the study personnel who measure, record, or assess
      the participant do not know which intervention the participant is receiving
      or, in the context of observational studies, do not know the external factors
      to which a participant has been exposed.
    submissionValue: ''
    synonyms: []
  - conceptId: C49659
    preferredTerm: Open Label
    definition: A study in which participants and study personnel know which intervention
      each participant is receiving.
    submissionValue: ''
    synonyms: []
  - conceptId: C28233
    preferredTerm: Single Blind
    definition: A study in which one party, either the participant or study personnel,
      does not know which intervention is administered to the participant.
    submissionValue: ''
    synonyms: []
